/* =========================
   index.html (Chat moderno estilo WhatsApp / ChatGPT)
========================= */

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bolty IA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- HEADER estilo WhatsApp -->
    <div class="header">
      <div class="avatar">🤖</div>
      <div class="header-info">
        <h1>Bolty</h1>
        <span>online • IA especializada</span>
      </div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat" id="chatBox">

      <div class="msg bot">
        👋 Olá! Eu sou o Bolty.
        Pergunte sobre IA, emprego, produtividade e tecnologia.
      </div>

    </div>

    <!-- TYPING INDICATOR -->
    <div class="typing" id="typing">Bolty está digitando...</div>

    <!-- INPUT -->
    <div class="input-area">
      <input id="userInput" placeholder="Mensagem..." />
      <button onclick="send()">➤</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
